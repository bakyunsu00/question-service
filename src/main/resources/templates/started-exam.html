<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>시험 시작</title>
</head>
<body>

<h2 th:text="|📝 ${exam.id}번 시험 응시|">📝 123번 시험 응시</h2>
<p th:text="|응시자: ${exam.user.nickname}|">응시자: Mock User</p>
<hr/>

<div th:each="record, i : ${exam.examRecords}" class="question-block">
    <h3 th:text="|${i.count}번 문제|">1번 문제</h3>

    <p th:text="${record.question.content}">문제 내용이 여기에 표시됩니다.</p>

    <form action="/submit-answer" method="post">
        <input type="hidden" name="recordId" th:value="${record.id}"/>
    </form>
</div>

</body>
</html>
