<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>시험 생성 폼</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    </style>
</head>
<body>

<h2>📝 시험 생성 요청</h2>

<form th:action="@{/api/user/exams}" method="post">

    <div class="form-group">
        <label for="questionCount">문항 수:</label>
        <input type="number" id="questionCount" name="questionCount"
               min="1" max="50" value="10" required>
    </div>

    <div class="form-group">
        <label for="difficulty">난이도:</label>
        <select id="difficulty" name="difficulty" required>
            <option value="LOW">쉬움 (EASY)</option>
            <option value="MEDIUM" selected>보통 (NORMAL)</option>
            <option value="HIGH">어려움 (HARD)</option>
        </select>
    </div>

    <button type="submit">시험 생성 및 시작</button>
</form>

</body>
</html>
