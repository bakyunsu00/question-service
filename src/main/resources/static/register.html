<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>

<h2>회원가입</h2>

<div>
    <label>아이디</label>
    <input type="text" id="username" required oninput="onUsernameChange()">
    <button type="button" onclick="checkUsername()">중복확인</button>
    <p id="username-msg" style="font-size: 13px;"></p>
</div>

<div>
    <label>비밀번호</label>
    <input type="password" id="password" required>
</div>

<div>
    <label>닉네임</label>
    <input type="text" id="nickname" required>
</div>

<button onclick="register()">가입하기</button>

<p id="error" style="color:red;"></p>

<button onclick="location.href='/login.html'" style="margin-top:10px;">
    로그인으로 돌아가기
</button>

<script src="/js/register.js">
</script>

</body>
</html>
