<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>

<h2>회원가입</h2>

<div>
    <label>아이디</label>
    <input type="text" id="username" required oninput="onUsernameChange()">
    <button type="button" onclick="checkUsername()">중복확인</button>
    <p id="username-msg" style="font-size: 13px;"></p>
</div>

<div>
    <label>비밀번호</label>
    <input type="password" id="password" required>
</div>

<div>
    <label>닉네임</label>
    <input type="text" id="nickname" required>
</div>

<button onclick="register()">가입하기</button>

<p id="error" style="color:red;"></p>

<button onclick="location.href='/login.html'" style="margin-top:10px;">
    로그인으로 돌아가기
</button>

<script>
function register() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const nickname = document.getElementById("nickname").value;

    fetch("/api/auth/register", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            username,
            password,
            nickname
        })
    })
    .then(res => {
        if (!res.ok) throw new Error("회원가입 실패");
        return res.text();   // ✅ 문자열 응답 받기
    })
    .then(msg => {
        alert(msg);          // ✅ "회원가입 성공"
        location.href = "/login.html";
    })
    .catch(err => {
        document.getElementById("error").innerText = "회원가입에 실패했습니다.";
    });
}
</script>

</body>
</html>
