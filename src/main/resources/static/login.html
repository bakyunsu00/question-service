<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>JWT 로그인 테스트</title>
</head>
<body>

<h1>JWT 로그인 테스트 페이지</h1>

<!-- ================= 로그인 영역 ================= -->
<div id="login-area">

    <h2>로그인</h2>

    <div>
        <label>아이디</label>
        <input type="text" id="username" required>
    </div>

    <div>
        <label>비밀번호</label>
        <input type="password" id="password" required>
    </div>

    <button onclick="login()">로그인</button>

    <p id="error" style="color:red;"></p>

    <button onclick="location.href='/register'" style="margin-top:10px;">
        회원가입
    </button>

</div>

<!-- ================= 로그아웃 영역 ================= -->
<div id="logout-area" style="display:none;">

    <h2>로그인 완료</h2>
    <p id="login-user"></p>

    <button onclick="logout()">로그아웃</button>

</div>

<script src="/js/auth.js"></script>
<script src="/js/autCheck.js"></script>

</body>
</html>
