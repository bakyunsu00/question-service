<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Index</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: #ffffff;
            padding: 40px;
            width: 360px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 24px;
            color: #333;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .exam-btn {
            background-color: #2196F3;
            color: white;
        }

        .exam-btn:hover {
            background-color: #1976D2;
        }

        .logout-btn {
            background-color: #f44336;
            color: white;
        }

        .logout-btn:hover {
            background-color: #d32f2f;
        }

        .divider {
            margin: 25px 0;
            height: 1px;
            background-color: #ddd;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>📘 시험 시스템</h1>

    <button class="exam-btn" onclick="goToExamForm()">시험 응시</button>

    <div class="divider"></div>

    <button class="logout-btn" onclick="logout()">로그아웃</button>
</div>

<script>
    function logout() {
        localStorage.removeItem("token");
        location.href = "/login";
    }

    function goToExamForm() {
        const token = localStorage.getItem('token');
        if (!token) {
            alert('로그인이 필요합니다.');
            location.href = '/login';
            return;
        }

        fetch('/exams', {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${token}`
            }
        })
            .then(response => {
                if (response.ok) {
                    location.href = '/exam-form.html';
                } else if (response.status === 403) {
                    alert('접근 권한이 없습니다. 다시 로그인 해주세요.');
                    localStorage.removeItem('token');
                    location.href = '/login';
                } else {
                    throw new Error('시험 폼 로딩 실패');
                }
            })
            .catch(error => {
                console.error('시험 폼 로딩 중 오류 발생:', error);
                alert('시험 폼을 불러오는 데 실패했습니다.');
            });
    }
</script>

</body>
</html>
