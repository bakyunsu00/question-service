<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문제 은행 관리자 페이지</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { max-width: 1000px; margin-top: 50px; }
        .choice-group { margin-bottom: 10px; padding: 10px; background-color: #f8f9fa; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
	<div class="d-flex justify-content-between align-items-center mb-5">
	        <h2 class="m-0">👮‍♂️ 문제 은행 관리자 (Admin)</h2>
	        <button id="btn-logout" class="btn btn-outline-danger btn-sm" onclick="logout()">로그아웃</button>
    </div>
    

    <div class="d-flex justify-content-between mb-3">
        <h4>문제 리스트</h4>
		<button id="btn-create-show" class="btn btn-primary" onclick="showCreateForm()">+ 문제 등록하기</button>
    </div>

    <div id="list-section">
        <table class="table table-hover table-bordered text-center">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>과목(카테고리)</th>
                    <th>난이도</th>
                    <th>유형</th>
                    <th>지문 (요약)</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody id="question-table-body">
                </tbody>
        </table>
        <div class="d-flex justify-content-center">
            <button class="btn btn-sm btn-outline-secondary" onclick="loadQuestions(0)">첫 페이지</button>
        </div>
    </div>

    <div id="form-section" style="display: none;">
        <div class="card">
            <div class="card-header bg-secondary text-white">문제 등록</div>
            <div class="card-body">
                <form id="question-form">
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">과목 선택</label>
                            <select class="form-select" id="inputCategory">
                                </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">난이도</label>
                            <select class="form-select" id="inputDifficulty">
                                <option value="LOW">하</option>
                                <option value="MEDIUM">중</option>
                                <option value="HIGH">상</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">유형</label>
                            <select class="form-select" id="inputType" onchange="toggleChoices()">
                                <option value="OBJECTIVE">객관식</option>
                                <option value="SUBJECTIVE">주관식</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">문제 지문</label>
                        <textarea class="form-control" id="inputContent" rows="3" placeholder="예: 다음 중 자바의 특징이 아닌 것은?"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">해설 (오답노트용)</label>
                        <textarea class="form-control" id="inputExplanation" rows="2" placeholder="해설을 입력하세요"></textarea>
                    </div>

					<div id="choice-area">
					    <div id="objective-section">
					        <label class="form-label fw-bold">보기 입력 (정답 체크)</label>
					        <div class="input-group mb-2">
					            <div class="input-group-text">
					                <input class="form-check-input mt-0" type="radio" name="correctAnswer" value="0" checked>
					            </div>
					            <input type="text" class="form-control choice-input" placeholder="보기 1번 내용">
					        </div>
					        <div class="input-group mb-2">
					            <div class="input-group-text">
					                <input class="form-check-input mt-0" type="radio" name="correctAnswer" value="1">
					            </div>
					            <input type="text" class="form-control choice-input" placeholder="보기 2번 내용">
					        </div>
					        <div class="input-group mb-2">
					            <div class="input-group-text">
					                <input class="form-check-input mt-0" type="radio" name="correctAnswer" value="2">
					            </div>
					            <input type="text" class="form-control choice-input" placeholder="보기 3번 내용">
					        </div>
					        <div class="input-group mb-2">
					            <div class="input-group-text">
					                <input class="form-check-input mt-0" type="radio" name="correctAnswer" value="3">
					            </div>
					            <input type="text" class="form-control choice-input" placeholder="보기 4번 내용">
					        </div>
					    </div> <div id="subjective-section" style="display: none;">
					        <label class="form-label fw-bold">주관식 정답 입력</label>
					        <input type="text" id="subjectiveAnswer" class="form-control" placeholder="정답을 입력하세요">
					    </div>
					</div>

                    <div class="d-flex justify-content-end mt-4">
                        <button type="button" class="btn btn-secondary me-2" onclick="showList()">취소</button>
                        <button type="button" class="btn btn-primary" onclick="saveQuestion()">저장하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="/js/admin.js"></script>
